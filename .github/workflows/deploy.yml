name: Deploy to Cloudflare Workers

# Builds the TanStack Start app (Nitro cloudflare-module preset) and deploys
# the Worker. Requires these repository secrets (Settings -> Secrets and
# variables -> Actions):
#   - CLOUDFLARE_API_TOKEN            (a token with the "Edit Cloudflare Workers" template)
#   - CLOUDFLARE_ACCOUNT_ID
#   - VITE_SUPABASE_URL               (baked into the client bundle at build time,
#                                       also synced to the Worker as SUPABASE_URL
#                                       runtime secret in the deploy step below)
#   - VITE_SUPABASE_PUBLISHABLE_KEY   (baked into the client bundle at build time;
#                                       use the new sb_publishable_... key, not the
#                                       legacy anon JWT key; also synced to the
#                                       Worker as SUPABASE_ANON_KEY)
#
# NOTE: SUPABASE_SERVICE_ROLE_KEY is NOT managed here. Set it manually via the
# Cloudflare dashboard (Workers & Pages -> worker -> Settings -> Variables and
# Secrets) since it is not currently a repository secret and grants full DB
# access bypassing RLS.

on:
  push:
    branches: [versi-2]
  workflow_dispatch: {}

# Never run two deploys at once; cancel superseded ones.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Cloudflare Workers)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config .output/server/wrangler.json

      # Server function (mis. generate tagihan) berjalan di Worker runtime dan
      # membaca env lewat `process.env`, BUKAN lewat bundle client
      # (import.meta.env). Variabel VITE_* di atas hanya di-bake ke bundle
      # client saat build, jadi server function tidak pernah melihatnya
      # kecuali kita salin sebagai secret runtime Worker di sini. Tanpa
      # langkah ini, server function gagal dengan error "SUPABASE_URL belum
      # dikonfigurasi di server" walau VITE_SUPABASE_URL sudah ada di GitHub
      # Secrets.
      - name: Sync runtime secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: yayasanat-tauhid-jibas-attauhid
        run: |
          echo -n "${{ secrets.VITE_SUPABASE_URL }}" | npx --yes wrangler@4 secret put SUPABASE_URL --name "$WORKER_NAME"
          echo -n "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" | npx --yes wrangler@4 secret put SUPABASE_ANON_KEY --name "$WORKER_NAME"
          # SUPABASE_SERVICE_ROLE_KEY sengaja TIDAK disinkron di sini karena
          # belum ada repository secret untuknya. Kelola manual lewat
          # dashboard Cloudflare (Workers & Pages -> nama worker -> Settings
          # -> Variables and Secrets), atau tambahkan sebagai repo secret
          # + baris serupa di atas kalau ingin ikut otomatis.
