name: Deploy to Cloudflare Workers

# Builds the TanStack Start app (Nitro cloudflare-module preset) and deploys
# the Worker. Two apps share this one workflow but point at different
# Supabase projects and different Cloudflare Workers, selected via GitHub
# Environments:
#   - push to `versi-4`  -> environment `production`
#   - push to `staging`  -> environment `staging`
#
# Each environment (Settings -> Environments) must define its own:
#   - CLOUDFLARE_API_TOKEN            [secret] (a token with the "Edit Cloudflare Workers" template)
#   - CLOUDFLARE_ACCOUNT_ID           [secret]
#   - VITE_SUPABASE_URL               [secret] (baked into the client bundle at build time,
#                                       also synced to the Worker as SUPABASE_URL
#                                       runtime secret in the deploy step below)
#   - VITE_SUPABASE_PUBLISHABLE_KEY   [secret] (baked into the client bundle at build time;
#                                       use the new sb_publishable_... key, not the
#                                       legacy anon JWT key; also synced to the
#                                       Worker as SUPABASE_ANON_KEY)
#   - WORKER_NAME                     [variable] name of the Cloudflare Worker to deploy to
#
# NOTE: SUPABASE_SERVICE_ROLE_KEY is NOT managed here. Set it manually via the
# Cloudflare dashboard (Workers & Pages -> worker -> Settings -> Variables and
# Secrets) since it is not currently a repository/environment secret and
# grants full DB access bypassing RLS.

on:
  push:
    branches: [versi-4, staging]
  workflow_dispatch: {}

# Never run two deploys of the same app at once; cancel superseded ones.
# Keyed by branch so production and staging deploys don't cancel each other.
concurrency:
  group: deploy-cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'versi-4' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Cloudflare Workers)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config .output/server/wrangler.json --name "${{ vars.WORKER_NAME }}"

      # Server function (mis. generate tagihan) berjalan di Worker runtime dan
      # membaca env lewat `process.env`, BUKAN lewat bundle client
      # (import.meta.env). Variabel VITE_* di atas hanya di-bake ke bundle
      # client saat build, jadi server function tidak pernah melihatnya
      # kecuali kita salin sebagai secret runtime Worker di sini. Tanpa
      # langkah ini, server function gagal dengan error "SUPABASE_URL belum
      # dikonfigurasi di server" walau VITE_SUPABASE_URL sudah ada di GitHub
      # Secrets.
      - name: Sync runtime secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
        run: |
          echo -n "${{ secrets.VITE_SUPABASE_URL }}" | npx --yes wrangler@4 secret put SUPABASE_URL --name "$WORKER_NAME"
          echo -n "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" | npx --yes wrangler@4 secret put SUPABASE_ANON_KEY --name "$WORKER_NAME"
          # SUPABASE_SERVICE_ROLE_KEY sengaja TIDAK disinkron di sini karena
          # belum ada repository secret untuknya. Kelola manual lewat
          # dashboard Cloudflare (Workers & Pages -> nama worker -> Settings
          # -> Variables and Secrets), atau tambahkan sebagai repo secret
          # + baris serupa di atas kalau ingin ikut otomatis.
