name: Deploy to Cloudflare Workers

# Builds the TanStack Start app (Nitro cloudflare-module preset) and deploys
# the Worker. Requires two repository secrets:
#   - CLOUDFLARE_API_TOKEN   (a token with the "Edit Cloudflare Workers" template)
#   - CLOUDFLARE_ACCOUNT_ID
# Add them under: Settings -> Secrets and variables -> Actions.

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

# Never run two deploys at once; cancel superseded ones.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Cloudflare Workers)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config .output/server/wrangler.json
